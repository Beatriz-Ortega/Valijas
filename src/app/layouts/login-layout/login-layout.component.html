<div class="container-fluid vh-100 d-flex justify-content-center align-items-center container-login">
  <div class="col-md-6" style="max-width: 600px;">
    <form class="container-login_form">
      <h2 class="text-center mb-4 mt-3">Login</h2>
      <div class="row justify-content-center">
        <div class="col-md-10">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="username" placeholder="Introduce tu usuario">
          </div>
        </div>
        <div class="col-md-10">
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="Introduce tu contraseña">
          </div>
        </div>
        <div class="col-md-10 d-flex justify-content-between align-items-center mb-3">
          <div>
              <button type="submit" class="btn btn-primary">Iniciar sesión</button>
          </div>
          <div class="mb-2">
              <a href="#" class="container-login_form_forget-password">¿Olvidaste tu contraseña?</a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
